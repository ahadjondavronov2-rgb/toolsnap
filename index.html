<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#03030a">
<title>ToolSnap — Free Online Tools</title>
<meta name="description" content="12 powerful free online tools. Image compressor, QR generator, password generator, JSON formatter and more. No signup, no download, 100% free.">
<meta property="og:title" content="ToolSnap — Free Online Tools">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Outfit:wght@400;500;600&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ── VARIABLES ─────────────────────────────────── */
:root{
  --bg:#03030a; --bg2:#07070f; --sf:#0c0c1a; --sf2:#121228; --sf3:#1a1a36;
  --bd:#1c1c34; --bd2:#252545; --bd3:#30305a;
  --ac:#6366f1; --ach:#4f46e5; --ag:rgba(99,102,241,.25); --al:rgba(99,102,241,.1);
  --cy:#06b6d4; --cl:rgba(6,182,212,.1);
  --tx:#f0f0fa; --t2:#c0c0dc; --mu:#6868a0; --mu2:#45456a;
  --ok:#22c55e; --er:#f43f5e; --wn:#f59e0b;
  --r:14px; --rs:8px; --rx:6px;
  --fd:'Syne',sans-serif; --fb:'Outfit',sans-serif; --fm:'Fira Code',monospace;
  --sh:0 4px 24px rgba(0,0,0,.5); --shl:0 20px 60px rgba(0,0,0,.65);
  --ease:cubic-bezier(.4,0,.2,1); --d:.22s;
}
/* ── RESET ─────────────────────────────────────── */
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--tx);font-family:var(--fb);line-height:1.65;overflow-x:hidden;min-height:100vh}
a{color:inherit;text-decoration:none}
button{font-family:var(--fb);cursor:pointer;border:none;background:none}
input,textarea,select{font-family:var(--fb)}
:focus-visible{outline:2px solid var(--ac);outline-offset:3px;border-radius:4px}

/* ── AMBIENT GLOW ──────────────────────────────── */
.amb{position:fixed;pointer-events:none;border-radius:50%;filter:blur(110px);z-index:0;opacity:.18}
.amb1{width:600px;height:600px;background:radial-gradient(var(--ac),transparent 70%);top:-200px;left:-150px;animation:dr1 20s ease-in-out infinite}
.amb2{width:500px;height:500px;background:radial-gradient(var(--cy),transparent 70%);bottom:-150px;right:-100px;animation:dr2 25s ease-in-out infinite}
@keyframes dr1{0%,100%{transform:translate(0,0)}50%{transform:translate(50px,40px)}}
@keyframes dr2{0%,100%{transform:translate(0,0)}50%{transform:translate(-50px,-40px)}}

/* ── LAYOUT ────────────────────────────────────── */
#prog{position:fixed;top:0;left:0;height:2px;width:0;background:linear-gradient(90deg,var(--ac),var(--cy));z-index:1000}
.wrap{max-width:1240px;margin:0 auto;padding:0 1.5rem}
.sec{padding:6.5rem 1.5rem;position:relative;z-index:1}
.sec-alt{background:var(--bg2)}

/* ── HEADER ────────────────────────────────────── */
#hdr{position:fixed;top:0;left:0;right:0;z-index:900;border-bottom:1px solid transparent;transition:background var(--d) var(--ease),border-color var(--d) var(--ease)}
#hdr.on{background:rgba(3,3,10,.93);backdrop-filter:blur(24px);border-bottom-color:var(--bd)}
.nav{max-width:1240px;margin:0 auto;padding:0 1.5rem;display:flex;align-items:center;gap:2rem;height:64px}
.logo{font-family:var(--fd);font-size:1.5rem;font-weight:800;cursor:pointer;flex-shrink:0;letter-spacing:-.5px}
.logo em{font-style:normal;background:linear-gradient(135deg,var(--ac),var(--cy));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.nav-links{display:flex;gap:1.75rem;list-style:none;margin:0 auto}
.nav-links a{font-size:.88rem;font-weight:500;color:var(--mu);transition:color var(--d);position:relative;padding-bottom:2px}
.nav-links a::after{content:'';position:absolute;bottom:-2px;left:0;right:0;height:1px;background:var(--ac);transform:scaleX(0);transition:transform var(--d) var(--ease);transform-origin:left}
.nav-links a:hover,.nav-links a.act{color:var(--tx)}
.nav-links a:hover::after,.nav-links a.act::after{transform:scaleX(1)}
.nav-cta{flex-shrink:0;padding:9px 20px;border-radius:var(--rs);background:var(--ac);color:#fff;font-size:.85rem;font-weight:600;transition:all var(--d)}
.nav-cta:hover{background:var(--ach);box-shadow:0 0 28px var(--ag)}
/* Hamburger */
.ham{display:none;flex-direction:column;gap:5px;width:36px;height:36px;align-items:center;justify-content:center;border-radius:var(--rx);margin-left:auto;transition:background var(--d)}
.ham:hover{background:var(--sf2)}
.ham span{display:block;width:20px;height:1.5px;background:var(--tx);border-radius:2px;transition:all var(--d) var(--ease)}
.ham.on span:nth-child(1){transform:translateY(6.5px) rotate(45deg)}
.ham.on span:nth-child(2){opacity:0;transform:scaleX(0)}
.ham.on span:nth-child(3){transform:translateY(-6.5px) rotate(-45deg)}
/* Mobile nav */
.mob-nav{position:fixed;top:64px;left:0;right:0;background:rgba(3,3,10,.97);backdrop-filter:blur(20px);border-bottom:1px solid var(--bd);padding:1.25rem;z-index:899;display:none;flex-direction:column;gap:.25rem}
.mob-nav.on{display:flex;animation:slidedn .2s var(--ease)}
@keyframes slidedn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}
.mob-nav a{color:var(--t2);font-size:1rem;font-weight:500;padding:.8rem 1rem;border-radius:var(--rs);transition:background var(--d)}
.mob-nav a:hover{background:var(--sf2)}

/* ── BUTTONS ────────────────────────────────────── */
.btn{display:inline-flex;align-items:center;gap:8px;padding:11px 22px;border-radius:var(--rs);font-size:.9rem;font-weight:600;cursor:pointer;transition:all var(--d) var(--ease);font-family:var(--fb);border:none;white-space:nowrap}
.btn-p{background:var(--ac);color:#fff}
.btn-p:hover{background:var(--ach);box-shadow:0 0 28px var(--ag);transform:translateY(-1px)}
.btn-g{background:transparent;color:var(--tx);border:1px solid var(--bd2)}
.btn-g:hover{border-color:var(--ac);color:var(--ac)}
.btn-ok{background:var(--ok);color:#fff}
.btn-ok:hover{filter:brightness(1.1);transform:translateY(-1px)}
.btn-t{background:var(--sf2);color:var(--tx);border:1px solid var(--bd)}
.btn-t:hover{border-color:var(--ac);color:var(--ac)}
.btn-sm{padding:7px 15px;font-size:.8rem}
.btn-lg{padding:14px 32px;font-size:1rem}
.btn-full{width:100%;justify-content:center}
.brow{display:flex;gap:.75rem;flex-wrap:wrap;margin-top:1rem}

/* ── SECTION HELPERS ────────────────────────────── */
.chip{display:inline-flex;align-items:center;gap:7px;padding:5px 14px;border-radius:100px;border:1px solid var(--bd2);background:var(--sf);font-size:.72rem;font-weight:600;color:var(--mu);font-family:var(--fm);letter-spacing:.5px;text-transform:uppercase}
.chip::before{content:'';width:5px;height:5px;border-radius:50%;background:var(--ac)}
.grad{background:linear-gradient(135deg,var(--ac) 20%,var(--cy) 80%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
h2.ttl{font-family:var(--fd);font-size:clamp(1.9rem,4.5vw,3.2rem);font-weight:800;line-height:1.12;margin:.75rem 0 1rem}
.sub{font-size:.95rem;color:var(--mu);max-width:520px;line-height:1.75}
.sh{max-width:660px;margin-bottom:3.5rem}
.sh.c{margin:0 auto 3.5rem;text-align:center}
.sh.c .sub{margin:0 auto}

/* ── HERO ───────────────────────────────────────── */
#hero{min-height:100svh;display:flex;align-items:center;padding:8rem 1.5rem 5rem;position:relative;z-index:1;overflow:hidden}
#hero::before{content:'';position:absolute;inset:0;pointer-events:none;z-index:-1;
  background:radial-gradient(ellipse 60% 50% at 0% 0%,rgba(99,102,241,.14) 0%,transparent 65%),
             radial-gradient(ellipse 40% 40% at 100% 80%,rgba(6,182,212,.1) 0%,transparent 65%)}
.hero-grid{max-width:1240px;margin:0 auto;width:100%;display:grid;grid-template-columns:1fr 1fr;gap:4rem;align-items:center}
.hero-badge{display:inline-flex;align-items:center;gap:8px;padding:6px 16px;border-radius:100px;border:1px solid rgba(99,102,241,.35);background:rgba(99,102,241,.08);font-size:.78rem;color:var(--cy);font-weight:500;margin-bottom:1.75rem}
.pulse{width:7px;height:7px;border-radius:50%;background:var(--cy);animation:plz 2s ease-in-out infinite}
@keyframes plz{0%,100%{box-shadow:0 0 0 0 rgba(6,182,212,.5)}50%{box-shadow:0 0 0 6px rgba(6,182,212,0)}}
.hero-h1{font-family:var(--fd);font-size:clamp(2.5rem,5.5vw,4.6rem);font-weight:800;line-height:1.08;margin-bottom:1.5rem;letter-spacing:-.5px}
.hero-p{font-size:1.05rem;color:var(--mu);line-height:1.8;margin-bottom:2.25rem;max-width:460px}
.hero-btns{display:flex;gap:1rem;flex-wrap:wrap;margin-bottom:3rem}
.hero-stats{display:flex;gap:3rem}
.hs-val{font-family:var(--fd);font-size:2rem;font-weight:800;background:linear-gradient(135deg,#fff,var(--t2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.hs-key{font-size:.75rem;color:var(--mu);margin-top:2px}
/* Visual cards */
.hero-vis{display:grid;grid-template-columns:1fr 1fr;gap:.85rem;animation:fly 7s ease-in-out infinite}
@keyframes fly{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
.hvc{background:var(--sf);border:1px solid var(--bd2);border-radius:var(--r);padding:1.2rem;cursor:pointer;transition:all var(--d);position:relative;overflow:hidden}
.hvc::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,var(--al),transparent);opacity:0;transition:opacity var(--d)}
.hvc:hover{border-color:var(--ac);transform:translateY(-3px);box-shadow:0 12px 32px var(--ag)}
.hvc:hover::before{opacity:1}
.hvc.wide{grid-column:span 2}
.hvc-i{font-size:1.6rem;margin-bottom:.6rem}
.hvc-n{font-weight:600;font-size:.85rem}
.hvc-d{font-size:.73rem;color:var(--mu);margin-top:2px}

/* ── TOOLS SECTION ──────────────────────────────── */
.tbar{display:flex;align-items:center;gap:1rem;flex-wrap:wrap;margin-bottom:2rem}
.tsearch{flex:1;min-width:200px;display:flex;align-items:center;gap:10px;background:var(--sf);border:1px solid var(--bd);border-radius:var(--rs);padding:10px 16px;transition:border-color var(--d)}
.tsearch:focus-within{border-color:var(--ac)}
.tsearch input{background:none;border:none;outline:none;color:var(--tx);font-size:.9rem;width:100%}
.tsearch input::placeholder{color:var(--mu2)}
.ftabs{display:flex;gap:.5rem;flex-wrap:wrap}
.ft{padding:8px 16px;border-radius:100px;border:1px solid var(--bd);background:transparent;color:var(--mu);font-size:.8rem;font-weight:500;transition:all var(--d);cursor:pointer}
.ft:hover{border-color:var(--bd3);color:var(--t2)}
.ft.on{background:var(--ac);border-color:var(--ac);color:#fff}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(225px,1fr));gap:1.25rem}
.tc{background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);padding:1.5rem;cursor:pointer;position:relative;overflow:hidden;transition:all var(--d)}
.tc-line{position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--ac),var(--cy));transform:scaleX(0);transition:transform var(--d);transform-origin:left}
.tc:hover{transform:translateY(-4px);box-shadow:0 20px 50px rgba(0,0,0,.4);border-color:var(--bd3)}
.tc:hover .tc-line{transform:scaleX(1)}
.tc-icon{font-size:1.9rem;margin-bottom:1rem}
.tc-name{font-weight:600;font-size:.95rem;margin-bottom:.3rem}
.tc-desc{font-size:.8rem;color:var(--mu);line-height:1.55}
.tc-foot{display:flex;align-items:center;justify-content:space-between;margin-top:1rem}
.tc-tag{padding:3px 10px;border-radius:100px;border:1px solid var(--bd2);background:var(--sf2);font-size:.69rem;color:var(--mu);font-family:var(--fm)}
.tc-arr{color:var(--bd3);transition:all var(--d)}
.tc:hover .tc-arr{color:var(--ac);transform:translate(2px,-2px)}
.no-res{grid-column:1/-1;text-align:center;padding:3rem;color:var(--mu)}

/* ── FEATURES ───────────────────────────────────── */
.fgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:1.5rem}
.fc{background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);padding:2rem;transition:all var(--d)}
.fc:hover{border-color:var(--bd3);box-shadow:var(--sh)}
.fc-chip{width:48px;height:48px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:1.4rem;margin-bottom:1.25rem}
.ci{background:rgba(99,102,241,.14)} .cc{background:rgba(6,182,212,.12)} .cg{background:rgba(34,197,94,.12)}
.ca{background:rgba(245,158,11,.12)} .cr{background:rgba(244,63,94,.12)} .cv{background:rgba(167,139,250,.12)}
.fc-t{font-family:var(--fd);font-size:1.05rem;font-weight:700;margin-bottom:.6rem}
.fc-p{font-size:.85rem;color:var(--mu);line-height:1.72}

/* ── STATS ──────────────────────────────────────── */
#stats{background:var(--bg2);padding:5.5rem 1.5rem}
.sgrid{max-width:900px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:2rem;text-align:center}
.snum{font-family:var(--fd);font-size:3.2rem;font-weight:800;background:linear-gradient(135deg,var(--ac),var(--cy));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;line-height:1}
.slbl{font-size:.82rem;color:var(--mu);margin-top:.6rem;line-height:1.5}

/* ── TESTIMONIALS ───────────────────────────────── */
.slwrap{overflow:hidden;border-radius:var(--r);margin-top:3rem}
.sltrack{display:flex;transition:transform .5s var(--ease)}
.slslide{min-width:100%}
.tgrd{display:grid;grid-template-columns:repeat(3,1fr);gap:1.25rem}
.tcard{background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);padding:1.75rem}
.tstars{color:#f59e0b;font-size:.9rem;letter-spacing:2px;margin-bottom:1rem}
.tq{font-size:.88rem;color:var(--t2);line-height:1.75;margin-bottom:1.25rem}
.tauth{display:flex;align-items:center;gap:.85rem}
.av{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--fd);font-size:.88rem;font-weight:700}
.av1{background:rgba(99,102,241,.18);color:var(--ac)} .av2{background:rgba(6,182,212,.16);color:var(--cy)}
.av3{background:rgba(34,197,94,.16);color:var(--ok)} .av4{background:rgba(245,158,11,.16);color:var(--wn)}
.av5{background:rgba(244,63,94,.14);color:var(--er)} .av6{background:rgba(167,139,250,.16);color:#a78bfa}
.aname{font-weight:600;font-size:.85rem} .arole{font-size:.74rem;color:var(--mu)}
.slctrl{display:flex;align-items:center;justify-content:center;gap:1rem;margin-top:2rem}
.slbtn{width:38px;height:38px;border-radius:50%;border:1px solid var(--bd2);background:var(--sf);color:var(--tx);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all var(--d);font-size:.9rem}
.slbtn:hover{border-color:var(--ac);color:var(--ac)}
.dots{display:flex;gap:.5rem}
.dot{width:7px;height:7px;border-radius:50%;background:var(--bd3);cursor:pointer;transition:all var(--d)}
.dot.on{background:var(--ac);width:22px;border-radius:4px}

/* ── CTA BANNER ─────────────────────────────────── */
#cta{background:var(--bg);padding:5rem 1.5rem}
.cta-box{max-width:900px;margin:0 auto;background:linear-gradient(135deg,var(--sf),var(--sf3));border:1px solid var(--bd2);border-radius:20px;padding:4rem 3rem;text-align:center;position:relative;overflow:hidden}
.cta-box::before{content:'';position:absolute;width:500px;height:500px;border-radius:50%;background:radial-gradient(rgba(99,102,241,.12),transparent 70%);top:-200px;left:50%;transform:translateX(-50%);pointer-events:none}
.cta-box h2{font-family:var(--fd);font-size:clamp(1.8rem,3.5vw,2.8rem);font-weight:800;margin-bottom:1rem;position:relative}
.cta-box p{color:var(--mu);max-width:460px;margin:0 auto 2rem;position:relative;font-size:.95rem}
.cta-btns{display:flex;gap:1rem;justify-content:center;flex-wrap:wrap;position:relative}

/* ── CONTACT ─────────────────────────────────────── */
.clayout{display:grid;grid-template-columns:1fr 1.4fr;gap:4rem;margin-top:3.5rem;align-items:start}
.cleft p{font-size:.9rem;color:var(--mu);line-height:1.8;margin-bottom:2rem}
.cpills{display:flex;flex-direction:column;gap:.85rem}
.cpill{display:flex;align-items:center;gap:.9rem;background:var(--sf);border:1px solid var(--bd);border-radius:var(--rs);padding:.95rem 1.25rem}
.cpill-lbl{font-size:.73rem;color:var(--mu)} .cpill-v{font-size:.87rem;font-weight:500;margin-top:2px}
.cform{background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);padding:2rem}
.form-r{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.fg{margin-bottom:1.1rem}
.fg label{display:block;font-size:.78rem;font-weight:500;color:var(--mu);margin-bottom:.45rem}
.fi,.fta,.fsel{width:100%;background:var(--sf2);border:1px solid var(--bd);border-radius:var(--rs);color:var(--tx);font-size:.9rem;padding:11px 14px;outline:none;transition:border-color var(--d)}
.fi:focus,.fta:focus,.fsel:focus{border-color:var(--ac)}
.fi.bad,.fta.bad{border-color:var(--er)}
.fta{resize:vertical;min-height:120px;line-height:1.65}
.ferr{font-size:.73rem;color:var(--er);margin-top:.3rem;display:none}
.ferr.show{display:block}
.form-ok{display:none;text-align:center;padding:3rem 1rem}
.form-ok .ico{font-size:3rem;margin-bottom:1rem}
.form-ok h3{font-family:var(--fd);font-size:1.4rem;margin-bottom:.5rem}
.form-ok p{color:var(--mu);font-size:.88rem}

/* ── FOOTER ──────────────────────────────────────── */
#footer{background:var(--bg);border-top:1px solid var(--bd);padding:4.5rem 1.5rem 2rem}
.ftop{display:grid;grid-template-columns:1.8fr 1fr 1fr 1fr;gap:3rem;margin-bottom:3rem}
.fbrand p{font-size:.83rem;color:var(--mu);max-width:250px;line-height:1.75;margin-top:.75rem}
.fcol h5{font-size:.8rem;font-weight:700;color:var(--t2);margin-bottom:1rem;text-transform:uppercase;letter-spacing:.5px}
.fcol ul{list-style:none;display:flex;flex-direction:column;gap:.6rem}
.fcol a{font-size:.82rem;color:var(--mu);transition:color var(--d)}
.fcol a:hover{color:var(--tx)}
.fbot{border-top:1px solid var(--bd);padding-top:1.5rem;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:1rem}
.fbot p{font-size:.77rem;color:var(--mu2)}
.fbadges{display:flex;gap:.5rem}
.fbdg{padding:3px 10px;border-radius:100px;border:1px solid var(--bd);background:var(--sf);font-size:.7rem;color:var(--mu);font-family:var(--fm)}

/* ── BACK TO TOP + TOAST ────────────────────────── */
#btt{position:fixed;bottom:2rem;right:1.5rem;z-index:800;width:42px;height:42px;border-radius:50%;background:var(--ac);color:#fff;display:flex;align-items:center;justify-content:center;font-size:1.1rem;cursor:pointer;opacity:0;pointer-events:none;transition:all var(--d);box-shadow:0 4px 20px var(--ag)}
#btt.show{opacity:1;pointer-events:auto}
#btt:hover{background:var(--ach);transform:translateY(-3px)}
#toast{position:fixed;bottom:2rem;left:50%;transform:translateX(-50%) translateY(80px);background:var(--sf3);border:1px solid var(--bd2);color:var(--tx);padding:10px 22px;border-radius:var(--rs);font-size:.85rem;z-index:9000;transition:transform .3s var(--ease);white-space:nowrap;box-shadow:var(--sh)}
#toast.show{transform:translateX(-50%) translateY(0)}

/* ── SCROLL REVEAL ───────────────────────────────── */
.sr{opacity:0;transform:translateY(28px);transition:opacity .6s var(--ease),transform .6s var(--ease)}
.srl{opacity:0;transform:translateX(-28px);transition:opacity .6s var(--ease),transform .6s var(--ease)}
.srr{opacity:0;transform:translateX(28px);transition:opacity .6s var(--ease),transform .6s var(--ease)}
.sr.in,.srl.in,.srr.in{opacity:1;transform:translate(0)}
.d1{transition-delay:.07s} .d2{transition-delay:.14s} .d3{transition-delay:.21s}
.d4{transition-delay:.28s} .d5{transition-delay:.35s} .d6{transition-delay:.42s}

/* ── TOOL VIEW ───────────────────────────────────── */
#tv{display:none;min-height:100svh;position:relative;z-index:1;padding-top:64px}
#tv.on{display:block;animation:fdin .25s var(--ease)}
@keyframes fdin{from{opacity:0}to{opacity:1}}
